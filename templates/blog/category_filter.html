<div class="filters ms-3 w-25">
    <div class="card glass-card mb-2">
        <div class="card-body">
            <h3 class="card-title">Categories</h3>
            <ul class="list-group list-group-flush">
                <li class="list-group-item filter-item bg-transparent">
                    <a href="{% url 'blog:index' %}" class="text-decoration-none">All</a>
                </li>
                {% for cat in category_list %}
                    <li class="list-group-item filter-item bg-transparent">
                        <a href="{% url 'blog:index' %}?category={{ cat.name|urlencode }}" class="text-decoration-none">
                            {{ cat.name }}
                        </a>
                        <span class="badge bg-primary rounded-pill">{{ cat.count }}</span>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
<style>
    .filter-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>
