{% extends 'base/base.html' %}
{% load static %}
{% block title %} 책상태 생성하기 {% endblock %}

{% block content %}
{% include 'library/_nav.html' %}
<div class="card glass-card">
    <div class="card-body p-5">
        <h1>책상태 생성하기</h1>
        <form action="" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <div class="card-footer">
        <a href="{% url 'library:bookinstances' %}" onclick="javascript:history.back(); return false;" class="btn btn-secondary">Go Back</a>
        <a href="{% url 'library:bookinstances' %}" class="btn btn-primary">Go List</a>
    </div>
</div>
{% endblock %}
