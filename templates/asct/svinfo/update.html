{% extends 'base/base.html' %}

{% block content %}
<div class="container-fluid px-4">
    {% include 'asct/_nav.html' %}
    <h1 class="mt-4">Server Info Update</h1>
    
    {% if messages %}
    <div class="mb-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="card mb-4">
        <div class="card-header">
            <i class="fas fa-edit me-1"></i>
            Update Server Information
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Update</button>
                <button type="submit" name="refresh_server" class="btn btn-info text-white" onclick="return confirm('Are you sure you want to refresh data from the server?');"><i class="fas fa-sync-alt me-1"></i> Refresh from Server</button>
                <a href="{% url 'asct:serverinfo_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
