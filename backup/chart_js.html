{% extends 'base/base.html' %}
{% block title %}CPU Usage Chart{% endblock %}

{% block content %}
<div class="container-fluid">
    {% include 'asct/_nav.html' %}
    
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3 border-bottom">
        <h1 class="h2">CPU Usage Trends</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <form class="d-flex me-2" method="get">
                {% if period %}<input type="hidden" name="period" value="{{ period }}">{% endif %}
                <select class="form-select form-select-sm me-2" name="q" onchange="this.form.submit()">
                    <option value="">All Hosts</option>
                    {% for host in host_list %}
                    <option value="{{ host }}" {% if query == host %}selected{% endif %}>{{ host }}</option>
                    {% endfor %}
                </select>
            </form>
            <div class="btn-group me-2">
                <a href="?period=1w{% if query %}&q={{ query|urlencode }}{% endif %}" class="btn btn-sm btn-primary {% if period == '1w' %}active{% endif %} h-31px">1주</a>
                <a href="?period=1m{% if query %}&q={{ query|urlencode }}{% endif %}" class="btn btn-sm btn-primary {% if period == '1m' %}active{% endif %} h-31px">1개월</a>
                <a href="?period=3m{% if query %}&q={{ query|urlencode }}{% endif %}" class="btn btn-sm btn-primary {% if period == '3m' %}active{% endif %} h-31px">3개월</a>
                <a href="?period=all{% if query %}&q={{ query|urlencode }}{% endif %}" class="btn btn-sm btn-primary {% if period == 'all' %}active{% endif %} h-31px">전체</a>
            </div>
            <a href="{% url 'asct:cpu_usage_list' %}" class="btn btn-sm btn-secondary h-31px">
                <i class="bi bi-list-ul"></i> 목록으로
            </a>
        </div>
        </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="chart-area" style="position: relative; height:60vh; width:100%">
                <canvas id="cpuChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js & Adapter for Time Scale -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('cpuChart').getContext('2d');
        const datasets = {{ datasets_json|safe }};
        
        // 색상 팔레트 생성 함수 (서버별 고유 색상 자동 할당)
        function getColor(index) {
            const hue = (index * 137.508) % 360; // Golden angle approximation for distinct colors
            return `hsl(${hue}, 70%, 50%)`;
        }

        // 각 데이터셋에 스타일 적용
        datasets.forEach((dataset, index) => {
            const color = getColor(index);
            dataset.borderColor = color;
            dataset.backgroundColor = color;
            dataset.pointRadius = 3;
            dataset.pointHoverRadius = 6;
            dataset.borderWidth = 2;
        });

        new Chart(ctx, {
            type: 'line',
            data: {
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'day', // 데이터 간격에 따라 'hour', 'day' 등으로 자동 조정됨
                            tooltipFormat: 'yyyy-MM-dd HH:mm'
                        },
                        title: {
                            display: true,
                            text: 'Date Time'
                        }
                    },
                    y: {
                        beginAtZero: true,
                        max: 100,
                        title: {
                            display: true,
                            text: 'Usage (%)'
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.y + '%';
                            }
                        }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
